# AUTO-GENERATED by Agento. DO NOT EDIT — this file is overwritten on upgrade.
# To customize, create docker-compose.override.yml (see docs/deployment/docker-compose-override.md).

name: agento

services:
  sandbox:
    build:
      context: ../.agento/docker/sandbox
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
        # {{ sandbox_package_args }}
    image: agento-sandbox:${AGENTO_VERSION:-latest}
    volumes:
      - ../workspace:/workspace
      - ../app/code:/app/code:ro
      - ../app/etc:/app/etc
      - ../logs:/app/logs
      - ../.venv/lib/python{{ python_version }}/site-packages/agento:/opt/agento-src/agento:ro
      # {{ extension_mounts_sandbox }}
    environment:
      - PYTHONPATH=/opt/agento-src
      - TZ=${TZ:-UTC}
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
    depends_on:
      toolbox:
        condition: service_healthy
    restart: unless-stopped

  toolbox:
    build:
      context: ../.agento/docker/toolbox
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: agento-toolbox:${AGENTO_VERSION:-latest}
    environment:
      - TZ=${TZ:-UTC}
      - CRONDB_HOST=mysql
      - CRONDB_PORT=3306
      - CRONDB_DATABASE=cron_agent
      - CRONDB_USER=cron_agent
      - CRONDB_PASSWORD=${MYSQL_PASSWORD:-cronagent_pass}
    env_file:
      - path: ../secrets.env
        required: false
    volumes:
      - ../app/code:/app/modules/user:ro
      - ../logs:/app/logs
      - ../workspace/artifacts:/workspace/artifacts
      - ../.venv/lib/python{{ python_version }}/site-packages/agento/toolbox:/opt/agento-toolbox-src:ro
      - ../.venv/lib/python{{ python_version }}/site-packages/agento/modules:/app/modules/core:ro
      - ../storage/versioned-artifacts:/srv/versioned-artifacts
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  cron:
    build:
      context: ../.agento/docker/cron
      args:
        SANDBOX_IMAGE: agento-sandbox:${AGENTO_VERSION:-latest}
    image: agento-cron:${AGENTO_VERSION:-latest}
    env_file:
      - path: ../secrets.env
        required: false
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=cron_agent
      - MYSQL_USER=cron_agent
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cronagent_pass}
      - DISABLE_LLM=${DISABLE_LLM:-0}
      - PYTHONPATH=/opt/agento-src
    volumes:
      - ../workspace:/workspace
      - ../app/code:/app/code:ro
      - ../app/etc:/app/etc
      - ../logs:/app/logs
      - ../.venv/lib/python{{ python_version }}/site-packages/agento:/opt/agento-src/agento:ro
      # {{ extension_mounts_cron }}
    networks:
      - agento-net
    depends_on:
      toolbox:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # The absence of `networks:`, `env_file:` and `environment:` is DELIBERATE and must stay.
  # One `networks:` line added for consistency puts every artifact on agento-net, where every
  # agent in every agent_view can read every artifact over plain HTTP with `allowed_artifacts`
  # bypassed for reads — silently, with no audit row.
  # Compose puts a service with no `networks:` key on the project's `default` network, and every
  # other service here names agento-net, so this container shares it with `proxy` alone.
  # Measured: the sandbox cannot even resolve the name `artifacts`. It publishes no host port:
  # the proxy is the only route to these files (PRD E1.5 §2.3).
  # The service mounts storage/versioned-artifacts/published EXACTLY, never the store root, and
  # no other module writes into that tree. docker-compose.override.yml is user-owned and Compose
  # APPENDS volumes, so this mount is the enforcement.
  # It is added unconditionally because regenerate_compose has no per-module service mechanism;
  # `mo:di versioned_artifacts` stops it SERVING through the app/etc mount below, not running.
  artifacts:
    image: agento-toolbox:${AGENTO_VERSION:-latest}
    command: ["node", "/app/modules/core/versioned_artifacts/server/artifacts-server.js"]
    volumes:
      - ../.venv/lib/python{{ python_version }}/site-packages/agento/modules:/app/modules/core:ro
      - ../storage/versioned-artifacts/published:/srv/published:ro
      - ../app/etc:/app/etc:ro
    healthcheck:
      # The baked HEALTHCHECK probes 3001 and would report this container unhealthy while it
      # serves fine. A disabled module answers 503 here — unhealthy on purpose, no restart loop.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The panel API, the launch redeem and the apps authorization (E2). It shares agento-net
  # with sandbox, so it trusts no identity header unless the request carries the proxy
  # secret (agento/web/server.py). No env_file and no encryption key: web never decrypts.
  # It reuses the cron image, like `artifacts` reuses the toolbox one.
  web:
    image: agento-cron:${AGENTO_VERSION:-latest}
    entrypoint: ["python", "-m", "agento.web"]
    user: agent
    # AGENTO_*_HOST / AGENTO_PROXY_PORT: the browser-facing origins, same defaults as proxy.
    # app/code + app/etc: the module inventory cron sees; web still never runs bootstrap().
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=cron_agent
      - MYSQL_USER=cron_agent
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cronagent_pass}
      - PYTHONPATH=/opt/agento-src
      - AGENTO_PANEL_HOST=${AGENTO_PANEL_HOST:-panel.localhost}
      - AGENTO_APPS_HOST=${AGENTO_APPS_HOST:-apps.localhost}
      - AGENTO_PROXY_PORT=${AGENTO_PROXY_PORT:-8443}
    volumes:
      - ../.venv/lib/python{{ python_version }}/site-packages/agento:/opt/agento-src/agento:ro
      # {{ extension_mounts_cron }}
      - ../app/code:/app/code:ro
      - ../app/etc:/app/etc:ro
      - proxy-internal:/run/agento:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # The ONLY service on both agento-net and the artifacts `default` network, and the only
  # route to artifact files. It routes nothing to the toolbox. Config: framework/docker/proxy/.
  proxy:
    image: caddy:2.11
    entrypoint: ["/bin/sh", "/etc/agento-proxy/entrypoint.sh"]
    environment:
      - AGENTO_PANEL_HOST=${AGENTO_PANEL_HOST:-panel.localhost}
      - AGENTO_APPS_HOST=${AGENTO_APPS_HOST:-apps.localhost}
      - AGENTO_SHARE_HOST=${AGENTO_SHARE_HOST:-share.localhost}
    volumes:
      - ../.agento/docker/proxy:/etc/agento-proxy:ro
      - proxy-internal:/run/agento
      - caddy-data:/data
    ports:
      - "127.0.0.1:${AGENTO_PROXY_PORT:-8443}:443"
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
      - default
    depends_on:
      - web
      - artifacts
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cronagent_root}
      MYSQL_DATABASE: cron_agent
      MYSQL_USER: cron_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cronagent_pass}
    volumes:
      - ../storage/mysql:/var/lib/mysql
      - ../docker/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agento-net
    restart: unless-stopped

networks:
  agento-net:
    driver: bridge

volumes:
  proxy-internal:
  caddy-data:
