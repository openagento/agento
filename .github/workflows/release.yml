name: Release

# `published` fires for a pre-release AND a full release. A DRAFT release sends no
# event at all, so a draft is tested by hand: Actions -> Release -> Run workflow with
# its tag (or a branch). A manual run tests and builds only; it never publishes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to test (drafts send no release event)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: cronagent_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/
      # Service containers accept no command override, so raise the limit at
      # runtime. Default is 151; the token-pool contention test drives 200
      # concurrent claimants that each hold a connection (no pooling), and
      # skips itself below 230.
      - name: Raise MySQL max_connections
        run: >-
          mysql -h 127.0.0.1 -P 3306 -u root -pcronagent_root
          -e "SET GLOBAL max_connections=300;"
      - run: uv run pytest -q
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: "3306"
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: cronagent_root
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The versioned_artifacts desk tests run against the REAL mount point
      # (`ARTIFACTS_ROOT = /workspace/artifacts`) rather than an injected test root, so
      # that containment is proven on the path production uses. A clean runner has no
      # /workspace; without this step they fail with EACCES instead of running, and the
      # non-root run here is the one the root container cannot give us.
      - run: sudo mkdir -p /workspace/artifacts && sudo chown -R "$(id -u):$(id -g)" /workspace
      - run: cd src/agento/toolbox && npm ci && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@v4
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Real LLM calls with real credentials, on the self-hosted VPS runner. The
  # credentials live only in that runner's persistent stack DB, never in GitHub
  # secrets: OAuth refresh tokens are single-use and rotate on every refresh, so
  # only a stack that keeps its DB between runs can hold them. See
  # docs/deployment/release-e2e.md.
  e2e:
    needs: build
    runs-on: [self-hosted, agento-e2e]
    environment: e2e
    # The job reaches GitHub only through `git fetch` of a public repo.
    permissions: {}
    # Plain `run:` is `bash -e` without pipefail: `pytest | tee` would exit with tee's 0.
    defaults:
      run:
        shell: bash
    # One OAuth refresh token per credential: two runs at once would rotate it twice.
    concurrency:
      group: e2e-oauth
      cancel-in-progress: false
    env:
      STACK: ${{ vars.E2E_STACK_DIR || '/srv/agento-e2e' }}
      REF: ${{ inputs.ref || github.ref_name }}
      COMPOSE_BAKE: "true"
    steps:
      # No actions/checkout: the stack's storage/, app/etc/ and workspace/ sit
      # inside the clone and must survive between runs.
      - name: Check out the release in the persistent stack
        run: |
          cd "$STACK"
          git fetch --force --tags origin "$REF"
          git checkout --force --detach FETCH_HEAD
      - name: Rebuild and start the stack
        run: |
          cd "$STACK/docker"
          docker compose -f docker-compose.dev.yml up -d --build --wait
      - name: Apply migrations
        run: |
          cd "$STACK"
          uv sync --group dev
          uv run bin/agento setup:upgrade --skip-onboarding
      # The e2e tests SKIP when the stack or a credential is missing. A skip here
      # means an untested release, so it fails the job.
      - name: Run e2e tests
        run: |
          cd "$STACK"
          AGENTO_E2E=1 uv run pytest -q -m e2e -rs | tee "$RUNNER_TEMP/e2e.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/e2e.log"; then
            echo "::error::e2e tests were skipped - the release is not proven"; exit 1
          fi

  publish:
    needs: [build, e2e]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  attach-assets:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v4
      - run: |
          uv venv /tmp/smoke
          source /tmp/smoke/bin/activate
          VERSION=$(echo "${{ github.event.release.tag_name }}" | sed 's/^v//')
          installed=false
          for i in $(seq 1 20); do
            uv pip install --refresh "agento-core==${VERSION}" && installed=true && break
            echo "PyPI not ready yet, retrying in 30s... (attempt $i/20)"
            sleep 30
          done
          $installed || { echo "Package not available on PyPI after 10 minutes"; exit 1; }
          agento --help
