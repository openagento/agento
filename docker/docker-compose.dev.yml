name: agento

services:
  sandbox:
    build:
      context: ../src/agento/framework/docker/sandbox
      dockerfile: Dockerfile
      args:
        HOST_UID: ${HOST_UID:-501}
        HOST_GID: ${HOST_GID:-20}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.165}
        CODEX_VERSION: ${CODEX_VERSION:-0.137.0}
        PI_VERSION: ${PI_VERSION:-0.84.1}
    image: agento-sandbox:latest
    volumes:
      - ../workspace:/workspace
      - ../app/code:/app/code:ro
      - ../app/etc:/app/etc
      - ../logs:/app/logs
    environment:
      - TZ=Europe/Warsaw
    stdin_open: true
    tty: true
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
    depends_on:
      toolbox:
        condition: service_healthy
    restart: unless-stopped

  toolbox:
    build:
      context: ..
      dockerfile: src/agento/framework/docker/toolbox/Dockerfile
      args:
        PACKAGE_DIR: src/agento/toolbox
        DOCKERFILE_DIR: src/agento/framework/docker/toolbox
        HOST_UID: ${HOST_UID:-501}
        HOST_GID: ${HOST_GID:-20}
    image: agento-toolbox:latest
    environment:
      - TZ=Europe/Warsaw
      - CRONDB_HOST=mysql
      - CRONDB_PORT=3306
      - CRONDB_DATABASE=cron_agent
      - CRONDB_USER=cron_agent
      - CRONDB_PASSWORD=${MYSQL_PASSWORD:-cronagent_pass}
    env_file:
      - path: .toolbox.env
        required: true
      - path: ../secrets.env
        required: false
    volumes:
      - ../src/agento/toolbox:/opt/agento-toolbox-src:ro
      - ../src/agento/modules:/app/modules/core:ro
      - ../app/code:/app/modules/user:ro
      - ../logs:/app/logs
      - ../workspace/artifacts:/workspace/artifacts
    security_opt:
      - no-new-privileges:true
    networks:
      - agento-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  cron:
    build:
      context: ..
      dockerfile: src/agento/framework/docker/cron/Dockerfile
      args:
        PYPROJECT_DIR: .
        SCRIPTS_DIR: src/agento/framework/docker/cron
    image: agento-cron:latest
    env_file:
      - path: .cron.env
        required: false
      - path: ../secrets.env
        required: false
    environment:
      - TZ=Europe/Warsaw
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=cron_agent
      - MYSQL_USER=cron_agent
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-cronagent_pass}
      - DISABLE_LLM=${DISABLE_LLM:-0}
      - PYTHONPATH=/opt/agento-src
    volumes:
      - ../workspace:/workspace
      - ../app/code:/app/code:ro
      - ../app/etc:/app/etc
      - ../logs:/app/logs
      - ../src/agento:/opt/agento-src/agento:ro
    networks:
      - agento-net
    depends_on:
      toolbox:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cronagent_root}
      MYSQL_DATABASE: cron_agent
      MYSQL_USER: cron_agent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cronagent_pass}
    volumes:
      - ../storage/mysql:/var/lib/mysql
      - ../src/agento/framework/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - agento-net
    restart: unless-stopped

networks:
  agento-net:
    driver: bridge
